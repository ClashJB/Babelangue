<div class="card h-100" id="card-{{ index }}-container">
    <div class="card-header d-flex justify-content-between align-items-center py-1 bg-step-{{ card.box - 1 }}">
        <span class="badge" style="font-size: large;">{{ index + 1 }}.</span>
        <form method="post">
            <div>
                <button class="btn btn-dark" type="submit" name="delete_card" value="{{ index + 1 }}"
                    style="font-size: larger; line-height: 1;"><i class="bi bi-trash-fill"></i></button>
                <button class="btn btn-light" type="button"
                    hx-get="{{ url_for('card_edit_partial', deck=deck_path, card=index) }}"
                    hx-target="#card-{{ index }}-container" hx-swap="outerHTML"
                    style="font-size: larger; line-height: 1;" title="Edit Card">
                    <i class="bi bi-pencil-square"></i>
                </button>
            </div>
        </form>
    </div>
    <ul class="list-group list-group-flush">
        {% for lang, result in card.card_row.items() %}
        <li class="list-group-item">
            <small class="text-muted text-uppercase">{{ lang }}</small><br>
            {{ result }}
        </li>
        {% endfor %}
    </ul>
</div>
