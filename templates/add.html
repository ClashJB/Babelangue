<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABELANGUE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Babelangue" />
    <link rel="manifest" href="/static/site.webmanifest" />

</head>

<body class="bg-light text-dark">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/static/babelangue_logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="fw-bold">BABELANGUE</span>
            </a>
            <div>
                <a class="btn btn-outline-primary me-2" href="/translator">Translator</a>
                <a class="btn btn-primary me-2" href="/trainer">Trainer</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-4">
        <form method="POST" id="mainForm">
            <input type="hidden" name="action" value="">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="mb-0">Create Deck</h1>
                <button class="btn btn-success" type="button" onclick="submitForm('save')">Save</button>
            </div>

            <div class="mb-4">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <label class="col-form-label fw-semibold">Name:</label>
                    </div>
                    <div class="col">
                        <input style="font-size: large;" type="text" name="deck_name"
                            value="{% if deck_name %}{{ deck_name }}{% endif %}" class="form-control"
                            placeholder="Deck Name (input here)" aria-label="deck_name"
                            onchange="submitForm('save_name')">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <div class="row align-items-center">
                    <div class="col-auto">
                        <label class="col-form-label fw-semibold">Languages:</label>
                    </div>
                    <div class="col">
                        <div style="font-size: large;" class="form-control bg-white">
                            {% if s_langs %}{{s_langs_text}}
                            {% else %}<span style="opacity: 75%;">Select languages (below)</span>{% endif %}
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header">
                    Available languages:
                </div>
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="row row-cols-2 row-cols-md-3 g-2">
                            {% for lang in langs %}
                            <div class="form-check">
                                <input name="selected_langs" class="form-check-input" type="checkbox"
                                    id="check{{ loop.index }}" value="{{ lang }}" {% if lang in s_langs %}checked{%
                                    endif %} onchange="submitForm('save_langs')">
                                <label class="form-check-label" for="check{{ loop.index }}">
                                    {{ lang }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script>
        function submitForm(action) {
            document.querySelector('input[name="action"]').value = action;
            document.getElementById('mainForm').submit();
        }
    </script>


</body>

</html>
