<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABELANGUE | Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Babelangue" />
    <link rel="manifest" href="/static/site.webmanifest" />

</head>

<body class="bg-light text-dark">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/static/babelangue_logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="fw-bold">BABELANGUE</span>
            </a>
            <div>
                <a class="btn btn-outline-primary me-2" href="/translator">Translator</a>
                <a class="btn btn-primary me-2" href="/trainer">Trainer</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/trainer">Your Decks</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('deck_overview', deck=deck_path) }}">{{ name }}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Card {{ index }}</li>
            </ol>
        </nav>

        <h3 class="mb-3">Edit Card</h3>

        <button type="button" class="btn btn-success" id="saveBtn"
            onclick="document.getElementById('saveForm').submit();">Save as Card <small
                class="opacity-75">(Ctrl+Enter)</small></button>

        <form method="POST" id="saveForm" class="mt-3">
            <input type="hidden" name="action" value="save">
            <input type="hidden" name="deck" value="{{ selected_deck }}">
            <input type="hidden" name="text" value="{{ text }}">

            {% for lang, tr in card.card_row.items() %}
            <div class="input-group mb-3">
                <span class="input-group-text">{{ lang }}</span>
                <input type="text" class="form-control" id="input_{{ lang }}" name="edited_{{ lang }}" value="{{ tr }}">
                <button class="btn btn-outline-secondary" type="button"
                    onclick="loadDefinitions('{{ lang }}', '{{ tr }}')">
                    Define
                </button>
            </div>
            <!-- Definition dropdown for this language -->
            <div id="definitions_{{ lang }}" class="mb-3" style="display: none;">
                <div class="card">
                    <div class="card-body">
                        <h6 class="card-title">Select a definition to append:</h6>
                        <div id="def_list_{{ lang }}" class="d-flex flex-column gap-2">
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </form>


    </div>




</body>

<script>
    // Ctrl + enter
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            const saveBtn = document.getElementById('saveBtn');
            if (!saveBtn.disabled) {
                e.preventDefault();
                document.getElementById('saveForm').submit();
            }
        }
    });

    // definitions
    async function loadDefinitions(lang, word) {
        const defContainer = document.getElementById('definitions_' + lang);
        const defList = document.getElementById('def_list_' + lang);

        // visibility
        if (defContainer.style.display === 'block') {
            defContainer.style.display = 'none';
            return;
        }

        // loading state
        defContainer.style.display = 'block';
        defList.innerHTML = '<div class="spinner-border spinner-border-sm" role="status"><span class="visually-hidden">Loading...</span></div> Loading definitions...';

        try {
            // get definitions
            const response = await fetch('/get_definitions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    word: word,
                    lang: lang
                })
            });

            const data = await response.json();

            if (data.error) {
                defList.innerHTML = `<div class="alert alert-warning mb-0">${data.error}</div>`;
                return;
            }

            // show definitions
            if (data.definitions && data.definitions.length > 0) {
                defList.innerHTML = data.definitions.map((def, index) =>
                    `<button type="button" class="btn btn-sm btn-outline-primary text-start" onclick="appendDefinition('${lang}', '${def.replace(/'/g, "\\'")}')">
                            ${def}
                        </button>`
                ).join('');
            } else {
                defList.innerHTML = '<div class="alert alert-info mb-0">No definitions found.</div>';
            }
        } catch (error) {
            defList.innerHTML = '<div class="alert alert-danger mb-0">Error loading definitions.</div>';
            console.error('Error:', error);
        }
    }

    // Append to output
    function appendDefinition(lang, definition) {
        const input = document.getElementById('input_' + lang);
        input.value = input.value + ' (' + definition + ')';

        // hide panel
        document.getElementById('definitions_' + lang).style.display = 'none';
    }
</script>

</html>
