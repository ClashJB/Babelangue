<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABELANGUE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Babelangue" />
    <link rel="manifest" href="/static/site.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
        integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
        crossorigin="anonymous"></script>
    <style>
        .bg-step-0 {
            background-color: #e61410;
        }

        .bg-step-1 {
            background-color: #ff8c00;
        }

        .bg-step-2 {
            background-color: #fdd835c8;
            color: #222;
        }

        .bg-step-3 {
            background-color: #8bc34a;
        }

        .bg-step-4 {
            background-color: #3e8741;
        }
    </style>
</head>

<body class="bg-light text-dark">
    <nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="/static/babelangue_logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="fw-bold">BABELANGUE</span>
            </a>
            <div>
                {% if session.get('username') %}
                <a class="btn btn-outline-secondary me-2" href="{{ url_for('auth.logout') }}"><i
                        class="bi bi-box-arrow-left"></i> Logout</a>
                {% else %}
                <a class="btn btn-outline-primary me-2" href="{{ url_for('auth.login') }}"><i
                        class="bi bi-person-fill"></i> Login</a>
                {% endif %}
                <a class="btn btn{% block nav_button_translator %}{% endblock %}-primary me-2"
                    href="/translator">Translator</a>
                <a class="btn btn{% block nav_button_trainer %}{% endblock %}-primary me-2" href="/trainer">Trainer</a>
            </div>
        </div>
    </nav>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
